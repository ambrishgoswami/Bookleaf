# Local development database. Production uses a managed Postgres (Render).
services:
  db:
    image: postgres:16-alpine
    container_name: bookleaf-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bookleaf
      POSTGRES_PASSWORD: bookleaf
      POSTGRES_DB: bookleaf
    ports:
      - "5435:5432"
    volumes:
      - bookleaf-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookleaf"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  bookleaf-pgdata:
