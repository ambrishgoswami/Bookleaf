# Render Blueprint — creates the database, API and web app in one step.
# Render dashboard → New → Blueprint → select this repo. You'll be prompted for
# the AI keys (both optional; without them the app runs on rule-based fallbacks).

databases:
  - name: bookleaf-db
    plan: free
    databaseName: bookleaf
    user: bookleaf

services:
  - type: web
    name: bookleaf-api
    runtime: node
    plan: free
    rootDir: server
    # Dev dependencies (prisma CLI, tsx for the seed) are needed at build/start.
    buildCommand: npm ci --include=dev && npm run build
    # Migrations + seed are idempotent: the seed upserts the dataset and only
    # adds demo tickets to an empty database.
    startCommand: npx prisma migrate deploy && npx prisma db seed && node dist/index.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: bookleaf-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: CORS_ORIGIN
        fromService:
          type: web
          name: bookleaf-web
          property: host
      - key: AI_PROVIDERS
        value: anthropic,gemini
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: bookleaf-web
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        fromService:
          type: web
          name: bookleaf-api
          property: host
    routes:
      # Single-page app: let the client router handle every path.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
